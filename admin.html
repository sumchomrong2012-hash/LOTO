<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOTO KENO — Admin</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --accent:#58a6ff; --win:#238636; --loss:#da3633; --text:#c9d1d9;
  }
  body { background:#000; color:var(--text); font-family:'Segoe UI',sans-serif; margin:0; padding:30px; min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; }
  h1 { color:var(--accent); letter-spacing:2px; }
  .sub { color:#8b949e; margin-bottom:30px; font-size:13px; }
  .panel { background:var(--bg); border:2px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .panel h2 { margin:0 0 16px; font-size:16px; color:var(--neon-n); }
  label { font-size:12px; color:#8b949e; display:block; margin-top:10px; }
  input { width:100%; padding:10px; margin-top:4px; background:#000; color:#fff; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  button { padding:10px 20px; margin-top:14px; border:none; background:var(--win); color:#fff; font-weight:bold; border-radius:6px; cursor:pointer; }
  button.refill { background:#1f6feb; }
  .msg { margin-top:12px; padding:10px; border-radius:6px; font-size:13px; display:none; }
  .msg.err { background:#4a1113; color:#ff7b7b; display:block; }
  .msg.ok  { background:#0a3622; color:#7fffb0; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { padding:10px; text-align:left; border-bottom:1px solid var(--border); }
  th { color:#8b949e; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .role-admin { color:var(--neon-n); font-weight:900; }
  .role-user  { color:#8b949e; }
  .back { color:var(--accent); text-decoration:none; font-size:13px; }
  .back:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="game.html">← Back to Game</a>
  <h1>LOTO KENO — Admin</h1>
  <div class="sub">Manage users &amp; refill balances</div>

  <div class="panel">
    <h2>💰 Refill a User</h2>
    <label>User Email</label>
    <input type="email" id="targetEmail" placeholder="user@example.com">
    <label>Amount ($)</label>
    <input type="number" id="refillAmount" value="100" min="1">
    <button class="refill" onclick="doRefill()">REFILL</button>
    <div class="msg" id="refillMsg"></div>
  </div>

  <div class="panel">
    <h2>👥 All Users</h2>
    <button onclick="loadUsers()">🔄 Refresh</button>
    <table id="usersTable">
      <thead>
        <tr>
          <th>Email</th><th>Balance</th><th>Role</th><th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
let currentUser = null;

(async function boot() {
  const user = await requireAuth();
  if (!user) return;
  currentUser = user;

  const profile = await getProfile(user.id);
  if (!profile || profile.role !== 'admin') {
    alert('Access denied. Admin only.');
    window.location.href = 'game.html';
    return;
  }

  loadUsers();
})();

async function loadUsers() {
  const { data, error } = await supabase
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false });

  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = '';

  if (error) {
    tbody.innerHTML = `<tr><td colspan="4" style="color:var(--loss)">${error.message}</td></tr>`;
    return;
  }

  data.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.email || '—'}</td>
      <td>$${Number(p.balance).toFixed(2)}</td>
      <td class="role-${p.role}">${p.role.toUpperCase()}</td>
      <td>${new Date(p.created_at).toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function doRefill() {
  const email = document.getElementById('targetEmail').value.trim();
  const amount = parseFloat(document.getElementById('refillAmount').value);
  const msg = document.getElementById('refillMsg');

  if (!email || !amount || amount <= 0) {
    msg.textContent = 'Enter a valid email and amount.';
    msg.className = 'msg err';
    return;
  }

  const { data, error } = await supabase.rpc('admin_refill', {
    p_email: email,
    p_amount: amount
  });

  if (error) {
    msg.textContent = 'Error: ' + error.message;
    msg.className = 'msg err';
  } else {
    msg.textContent = `Refilled ${data.email} → new balance $${Number(data.new_balance).toFixed(2)}`;
    msg.className = 'msg ok';
    loadUsers();
  }
}
</script>
</body>
</html>
