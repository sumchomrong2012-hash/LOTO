<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTO KENO — Admin</title>
<style>
:root{--bg:#0d1117;--border:#30363d;--accent:#58a6ff;--win:#238636;--text:#c9d1d9}
*{box-sizing:border-box}
body{background:#000;color:var(--text);font-family:'Segoe UI',sans-serif;margin:0;padding:20px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{color:var(--accent);margin:0;font-size:1.4rem;letter-spacing:2px}h2{font-size:1rem;margin:24px 0 8px}
a{color:var(--accent)}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto}
input{padding:8px;background:#000;color:#fff;border:1px solid var(--border);border-radius:6px;font-size:14px}
button{padding:8px 12px;border:0;background:var(--win);color:#fff;font-weight:700;border-radius:6px;cursor:pointer}
button.alt{background:#21262d}button:disabled{opacity:.6}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:#8b949e;font-weight:600}.pos{color:#7fffb0}.neg{color:#ffb3b3}
#search{width:100%;margin-bottom:10px}
.msg{margin:10px 0;padding:10px;border-radius:6px;font-size:13px;display:none}
.msg.err{background:#4a1113;color:#ffb3b3;display:block}.msg.ok{background:#0a3622;color:#7fffb0;display:block}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ADMIN</h1><span><a href="game.html">Back to game</a> · <button class="alt" id="logoutBtn">LOGOUT</button></span></header>
  <div class="msg" id="msg"></div>
  <h2>Players</h2>
  <div class="card">
    <input id="search" placeholder="Search by email…">
    <table><thead><tr><th>Email</th><th>Role</th><th>Balance</th><th>Add / remove amount</th><th></th></tr></thead><tbody id="users"></tbody></table>
  </div>
  <p style="font-size:12px;color:#8b949e">Use a positive number to refill, a negative number to deduct.</p>
  <h2>Recent transactions</h2>
  <div class="card"><table><thead><tr><th>Time</th><th>Player</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Note</th></tr></thead><tbody id="tx"></tbody></table></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
const $ = id => document.getElementById(id);
let users = [];
function show(t, ok) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
function cell(tr, text, cls) { const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; }
const money = n => '$' + Number(n).toFixed(2);

async function loadUsers() {
  const { data, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) return show(error.message);
  users = data; renderUsers();
}

function renderUsers() {
  const q = $('search').value.trim().toLowerCase();
  const body = $('users'); body.innerHTML = '';
  users.filter(u => u.email.toLowerCase().includes(q)).forEach(u => {
    const tr = document.createElement('tr');
    cell(tr, u.email); cell(tr, u.role); cell(tr, money(u.balance));
    const td = document.createElement('td');
    const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.01'; inp.placeholder = 'e.g. 100'; inp.style.width = '110px';
    td.appendChild(inp); tr.appendChild(td);
    const td2 = document.createElement('td'); const btn = document.createElement('button'); btn.textContent = 'APPLY';
    btn.onclick = async () => {
      const amt = parseFloat(inp.value);
      if (!amt) return show('Enter an amount (not zero).');
      if (!confirm(`${amt > 0 ? 'Add' : 'Deduct'} ${money(Math.abs(amt))} ${amt > 0 ? 'to' : 'from'} ${u.email}?`)) return;
      btn.disabled = true;
      const { error } = await supabase.rpc('admin_adjust_balance', { p_user: u.id, p_amount: amt, p_note: 'admin adjustment' });
      btn.disabled = false;
      if (error) return show(error.message);
      show('Balance updated for ' + u.email, true);
      await loadUsers(); await loadTx();
    };
    td2.appendChild(btn); tr.appendChild(td2); body.appendChild(tr);
  });
}

async function loadTx() {
  const { data, error } = await supabase.from('transactions').select('*, profiles(email)').order('id', { ascending: false }).limit(50);
  if (error) return show(error.message);
  const body = $('tx'); body.innerHTML = '';
  data.forEach(t => {
    const tr = document.createElement('tr');
    cell(tr, new Date(t.created_at).toLocaleString());
    cell(tr, t.profiles ? t.profiles.email : '');
    cell(tr, t.kind);
    cell(tr, money(t.amount), t.amount >= 0 ? 'pos' : 'neg');
    cell(tr, money(t.balance_after)); cell(tr, t.note || '');
    body.appendChild(tr);
  });
}

(async () => {
  const { data } = await supabase.auth.getSession();
  if (!data.session) { location.href = 'index.html'; return; }
  const { data: me } = await supabase.from('profiles').select('role').eq('id', data.session.user.id).single();
  if (!me || me.role !== 'admin') { location.href = 'game.html'; return; }
  $('search').addEventListener('input', renderUsers);
  $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.href = 'index.html'; };
  await loadUsers(); await loadTx();
})();
</script>
</body>
</html>
