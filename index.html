<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOTO KENO — Login</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --accent:#58a6ff; --win:#238636; --text:#c9d1d9; }
  * { box-sizing: border-box; }
  body {
    background: #000; color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    margin: 0; display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .card {
    width: 400px; background: var(--bg); border: 2px solid var(--border);
    padding: 40px; border-radius: 16px;
  }
  h1 { color: var(--accent); text-align: center; margin: 0 0 6px; letter-spacing: 2px; }
  .sub { text-align: center; color: #8b949e; margin-bottom: 30px; font-size: 13px; }
  label { font-size: 12px; color: #8b949e; display: block; margin-top: 14px; }
  input {
    width: 100%; padding: 12px; margin-top: 6px;
    background: #000; color: #fff; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px;
  }
  button {
    width: 100%; padding: 14px; margin-top: 20px; border: none;
    background: var(--win); color: #fff; font-weight: 900; font-size: 15px;
    border-radius: 8px; cursor: pointer; letter-spacing: 1px;
  }
  button.alt { background: #21262d; color: #fff; }
  .msg { margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.err { background: #4a1113; color: #ff7b7b; display: block; }
  .msg.ok  { background: #0a3622; color: #7fffb0; display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>LOTO KENO</h1>
    <div class="sub">Sign in to play</div>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">

    <button id="loginBtn">LOGIN</button>
    <button class="alt" id="signupBtn">CREATE ACCOUNT</button>

    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js-supabase-client.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    function show(text, ok) {
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'game.html';
    }
    checkExistingSession();

    document.getElementById('loginBtn').onclick = async () => {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });
      if (error) return show(error.message, false);
      show('Logged in...', true);
      setTimeout(() => window.location.href = 'game.html', 400);
    };

    document.getElementById('signupBtn').onclick = async () => {
      const { data, error } = await supabase.auth.signUp({
        email: email.value.trim(),
        password: password.value
      });
      if (error) return show(error.message, false);
      show('Account created! You can now log in.', true);
    };
  </script>
</body>
</html>
